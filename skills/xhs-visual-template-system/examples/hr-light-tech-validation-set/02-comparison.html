<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>真正费人的，是每天重复下载</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <main class="page-shell compact-title" data-theme="hr-light-tech" data-page-job="pain-comparison">
    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼RPA">
    <section class="content">
      <div class="eyebrow">工作方式对比</div>
      <header class="headline-block">
        <h2>真正费人的，<br>是<span class="highlight">每天重复下载</span></h2>
        <p class="support">门店和平台一多，运营每天都在重复同一套动作。</p>
      </header>
      <section class="comparison-grid" aria-label="人工处理与自动归档对比">
        <article class="comparison-panel is-before">
          <span class="panel-kicker">人工处理</span>
          <h3>人跟着报表跑</h3>
          <div class="comparison-item">逐个平台登录</div>
          <div class="comparison-item">反复查找和下载</div>
          <div class="comparison-item">整理后再手动上传</div>
        </article>
        <div class="comparison-bridge">→</div>
        <article class="comparison-panel is-after">
          <span class="panel-kicker">自动归档</span>
          <h3>报表按计划到位</h3>
          <div class="comparison-item">指定报表和账号</div>
          <div class="comparison-item">设置每日或每小时运行</div>
          <div class="comparison-item">自动存进目标位置</div>
        </article>
      </section>
    </section>
    <footer class="page-meta"><span>先把重复搬运交出去，再开始分析</span><span class="page-no">02 / 05</span></footer>
  </main>
</body>
</html>
