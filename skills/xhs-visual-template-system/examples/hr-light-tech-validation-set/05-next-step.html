<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>试用前，先确认这3件事</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <main class="page-shell compact-title" data-theme="hr-light-tech" data-page-job="result-next-step">
    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼RPA">
    <section class="content">
      <div class="eyebrow">申请试用前</div>
      <header class="headline-block">
        <h2>先确认这<span class="highlight">3件事</span></h2>
        <p class="support">把具体任务说清楚，技术顾问才能更快判断是否适合。</p>
      </header>
      <div class="fit-list">
        <div class="fit-item">需要获取哪个平台、哪一种报表？</div>
        <div class="fit-item">每天、每周，还是每小时运行一次？</div>
        <div class="fit-item">结果要存进 MySQL、飞书、钉钉还是本地？</div>
      </div>
      <section class="next-step">
        <h3>带着一项具体任务来试</h3>
        <p>填写试用申请后，会有技术顾问联系，进一步确认平台、报表、频率和存储目标。</p>
        <div class="cta-button">填写表单申请试用</div>
      </section>
    </section>
    <footer class="page-meta"><span>八爪鱼数据连接器</span><span class="page-no">05 / 05</span></footer>
  </main>
</body>
</html>
