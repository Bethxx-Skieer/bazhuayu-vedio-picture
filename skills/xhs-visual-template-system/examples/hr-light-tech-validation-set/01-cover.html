<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>每天搬报表？让它自动归档</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <main class="page-shell" data-theme="hr-light-tech" data-page-job="main-value-cover">
    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼RPA">
    <section class="content">
      <div class="eyebrow">多平台经营数据</div>
      <header class="headline-block">
        <h1>每天搬报表？<br>让它<span class="highlight">自动归档</span></h1>
        <p class="support">后台里的订单、账单和推广报表，按计划下载、整理，再存进团队真正使用的位置。</p>
      </header>
      <section class="surface-card visual-anchor cover-anchor" aria-label="数据归档流程">
        <div class="section-label">报表自己走完这条路</div>
        <div class="mini-flow">
          <article class="mini-node">
            <span class="num">01</span><strong>进入后台</strong><p>淘宝天猫、京东、拼多多等</p>
          </article>
          <div class="flow-arrow">›</div>
          <article class="mini-node is-action">
            <span class="num">02</span><strong>下载整理</strong><p>按时获取并处理报表</p>
          </article>
          <div class="flow-arrow">›</div>
          <article class="mini-node is-success">
            <span class="num">03</span><strong>同步归档</strong><p>数据库、飞书、本地等</p>
          </article>
        </div>
        <div class="result-band"><strong>不用每天逐个平台找报表、改格式、再上传</strong><span>自动完成</span></div>
      </section>
    </section>
    <footer class="page-meta"><span>八爪鱼数据连接器</span><span class="page-no">01 / 05</span></footer>
  </main>
</body>
</html>
