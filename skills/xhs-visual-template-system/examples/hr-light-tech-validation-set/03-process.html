<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>一张报表，自动走完4步</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <main class="page-shell compact-title" data-theme="hr-light-tech" data-page-job="process-explanation">
    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼RPA">
    <section class="content">
      <div class="eyebrow">从采集到使用</div>
      <header class="headline-block">
        <h2>一张报表，<br>自动走完<span class="highlight">4步</span></h2>
        <p class="support">账号授权和目标位置配置好后，后面的重复动作交给系统。</p>
      </header>
      <section class="process-flow" aria-label="四步自动化流程">
        <article class="process-node">
          <span class="node-num">01</span><h3>连接账号</h3><p>选定平台、店铺和需要的报表。</p><span class="node-chip">配置一次</span>
        </article>
        <article class="process-node is-action">
          <span class="node-num">02</span><h3>定时采集</h3><p>按每日或每小时进入后台下载。</p><span class="node-chip">自动执行</span>
        </article>
        <article class="process-node">
          <span class="node-num">03</span><h3>自动整理</h3><p>删除无效表头，统一字段和格式。</p><span class="node-chip">标准化</span>
        </article>
        <article class="process-node is-success">
          <span class="node-num">04</span><h3>同步目标</h3><p>写入 MySQL、飞书、多维表或本地。</p><span class="node-chip">直接使用</span>
        </article>
      </section>
      <div class="result-band"><strong>运营、财务和数据团队拿到的是已整理的结果</strong><span>云端运行</span></div>
    </section>
    <footer class="page-meta"><span>八爪鱼数据连接器</span><span class="page-no">03 / 05</span></footer>
  </main>
</body>
</html>
