<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>八爪鱼冰蓝 · 封面-IP-业务场景</title>
  <link rel="stylesheet" href="cover-system.css">
</head>
<body>
  <main class="page-shell scenario-cover" data-theme="octopus-blue" data-page-job="scenario-explanation-cover">
    <!-- 替换为按 3:4 画布生成的无文字场景图；上半部必须保留安静的标题安全区。 -->
    <figure class="atmosphere-image scenario-background">
      <img src="assets/scenario-reconciliation-bg.png" alt="小八执行订单与结算自动匹配的企业自动化场景">
    </figure>
    <div class="scenario-title-mist" aria-hidden="true"></div>

    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼 RPA">

    <header class="headline-block scenario-title">
      <h1>
        <span>Temu 对账自动化</span>
        <strong>效率提升 <em>84%</em></strong>
      </h1>
    </header>

    <p class="scenario-subtitle">Codex + RPA 自动匹配订单与结算</p>

    <!-- 每个 scene-callout 都必须贴近并指向对应对象，不能排成脱离场景的统一标签栏。 -->
    <section class="scene-callouts" aria-label="场景说明">
      <div class="scene-callout is-order">
        <strong>订单数据</strong>
        <small>读取订单明细</small>
      </div>
      <div class="scene-callout is-settlement">
        <strong>结算数据</strong>
        <small>获取结算账单</small>
      </div>
      <div class="scene-callout is-match">
        <strong>自动匹配</strong>
        <small>核对订单与金额</small>
      </div>
      <div class="scene-callout is-alert">
        <strong>异常提醒</strong>
        <small>差异自动标记</small>
      </div>
    </section>
  </main>
</body>
</html>
