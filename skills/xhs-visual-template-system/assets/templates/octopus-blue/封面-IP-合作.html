<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>八爪鱼冰蓝 · 封面-IP-合作</title>
  <link rel="stylesheet" href="cover-system.css">
</head>
<body>
  <main class="page-shell cover collab-cover" data-theme="octopus-blue" data-page-job="main-value-cover">
    <div class="brand-lockup collab-joint-brand" aria-label="八爪鱼RPA与WorkBuddy联合展示">
      <div class="joint-brand-item joint-brand-octoparse">
        <img src="assets/octoparse-rpa-icon-blue.png" alt="">
        <strong>八爪鱼RPA</strong>
      </div>
      <span class="joint-brand-divider" aria-hidden="true">×</span>
      <div class="joint-brand-item joint-brand-workbuddy">
        <img src="assets/workbuddy-icon.png" alt="">
        <strong>WorkBuddy</strong>
      </div>
    </div>

    <header class="headline-block collab-title">
      <h1>
        <span class="collab-partners">WorkBuddy</span>
        <span class="collab-task">越用越好用</span>
      </h1>
      <p>越用越顺手，越懂你</p>
    </header>

    <section class="ip-collaboration-scene collab-stage" data-layer-order="background-computer-screenshot-two-ip" aria-label="小八与WorkBuddy围绕真实任务界面的笔记本协作">
      <div class="collab-scene-glow" aria-hidden="true"></div>

      <div class="collab-laptop" aria-label="透明笔记本电脑素材，屏幕上叠加真实WorkBuddy任务截图">
        <img class="collab-laptop-shell" src="assets/laptop-transparent.png" alt="银色笔记本电脑">
        <div class="collab-laptop-screen">
          <img src="assets/workbuddy-task-interface.png" alt="WorkBuddy热点快报对话任务界面">
        </div>
      </div>

      <img class="collab-octopus-fixed" src="assets/octopus-wave-tablet.png" alt="挥手并拿着平板的小八">
      <img class="collab-workbuddy-fixed" src="assets/workbuddy-standing-operate.png" alt="站在笔记本右下方操作任务的WorkBuddy">
    </section>
  </main>
</body>
</html>
