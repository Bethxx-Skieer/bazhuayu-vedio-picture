<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>流程说明</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="page-shell compact-title" data-theme="hr-light-tech" data-page-job="process-explanation">
    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼RPA">
    <section class="content">
      <div class="eyebrow">自动化流程</div>
      <header class="headline-block">
        <h2>从输入到结果，<span class="highlight">四步跑完</span></h2>
        <p class="support">节点从动作开始，说明信息如何流动，而不是罗列四个卖点。</p>
      </header>
      <section class="process-flow" aria-label="四步流程">
        <article class="process-node">
          <span class="node-num">01</span><h3>连接账号</h3><p>完成授权与任务配置，明确数据来源。</p><span class="node-chip">输入</span>
        </article>
        <article class="process-node is-action">
          <span class="node-num">02</span><h3>定时获取</h3><p>按计划进入后台，完成指定操作。</p><span class="node-chip">动作</span>
        </article>
        <article class="process-node">
          <span class="node-num">03</span><h3>自动整理</h3><p>处理无效表头、字段和数据格式。</p><span class="node-chip">处理</span>
        </article>
        <article class="process-node is-success">
          <span class="node-num">04</span><h3>同步结果</h3><p>写入团队真正使用的目标位置。</p><span class="node-chip">结果</span>
        </article>
      </section>
      <div class="result-band"><strong>人负责判断，系统负责重复执行</strong><span>流程闭环</span></div>
    </section>
    <footer class="page-meta"><span>输入 → 处理 → 使用</span><span class="page-no">03</span></footer>
  </main>
</body>
</html>
