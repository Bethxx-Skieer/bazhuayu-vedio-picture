<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>功能合集</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="page-shell compact-title" data-theme="hr-light-tech" data-page-job="feature-collection">
    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼RPA">
    <section class="content">
      <div class="eyebrow">围绕一个任务</div>
      <header class="headline-block">
        <h2>四个能力，解决<span class="highlight">同一件事</span></h2>
        <p class="support">功能项按动作、对象和结果表达，不把产品手册整页搬过来。</p>
      </header>
      <section class="feature-grid">
        <article class="feature-item"><span class="feature-num">01 / INPUT</span><h3>连接来源</h3><p>说明系统从哪里获取需要处理的信息。</p></article>
        <article class="feature-item"><span class="feature-num">02 / RUN</span><h3>定时执行</h3><p>说明任务如何在无人值守时持续运行。</p></article>
        <article class="feature-item"><span class="feature-num">03 / CLEAN</span><h3>整理数据</h3><p>说明哪些重复加工动作被自动完成。</p></article>
        <article class="feature-item"><span class="feature-num">04 / SYNC</span><h3>同步结果</h3><p>说明团队最终在哪里继续使用结果。</p></article>
      </section>
      <div class="platform-group" aria-label="平台示例">
        <span class="platform-badge">平台 A</span><span class="platform-badge">平台 B</span><span class="platform-badge">数据库</span><span class="platform-badge">多维表</span>
      </div>
    </section>
    <footer class="page-meta"><span>功能围绕任务组织</span><span class="page-no">05</span></footer>
  </main>
</body>
</html>
