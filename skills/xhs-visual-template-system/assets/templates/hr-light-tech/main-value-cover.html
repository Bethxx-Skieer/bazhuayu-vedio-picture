<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>主价值封面</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="page-shell" data-theme="hr-light-tech" data-page-job="main-value-cover">
    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼RPA">
    <section class="content">
      <div class="eyebrow">产品解决方案</div>
      <header class="headline-block">
        <h1>把重复操作<br>交给<span class="highlight">自动化</span></h1>
        <p class="support">一句话说明具体任务、原来的麻烦，以及新方法带来的改变。</p>
      </header>
      <section class="surface-card visual-anchor" aria-label="核心流程预览">
        <div class="section-label">从任务到结果</div>
        <div class="mini-flow">
          <article class="mini-node">
            <span class="num">01</span><strong>获取信息</strong><p>说明输入对象</p>
          </article>
          <div class="flow-arrow">›</div>
          <article class="mini-node is-action">
            <span class="num">02</span><strong>自动处理</strong><p>说明关键动作</p>
          </article>
          <div class="flow-arrow">›</div>
          <article class="mini-node is-success">
            <span class="num">03</span><strong>沉淀结果</strong><p>说明最终去向</p>
          </article>
        </div>
        <div class="result-band"><strong>主价值：减少重复搬运，让数据按时可用</strong><span>自动完成</span></div>
      </section>
    </section>
    <footer class="page-meta"><span>官方产品方案</span><span class="page-no">01</span></footer>
  </main>
</body>
</html>
