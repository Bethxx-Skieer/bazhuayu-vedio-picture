<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>痛点对比</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="page-shell compact-title" data-theme="hr-light-tech" data-page-job="pain-comparison">
    <img class="brand-lockup" src="assets/brand-logo.png" alt="数阔八爪鱼RPA">
    <section class="content">
      <div class="eyebrow">工作方式对比</div>
      <header class="headline-block">
        <h2>同一项工作，<span class="highlight">换一种做法</span></h2>
        <p class="support">只比较同一个任务前后的动作、耗时与结果。</p>
      </header>
      <section class="comparison-grid" aria-label="改变前后对比">
        <article class="comparison-panel is-before">
          <span class="panel-kicker">原来的方式</span>
          <h3>人跟着任务跑</h3>
          <div class="comparison-item">每天打开多个后台</div>
          <div class="comparison-item">重复下载和整理</div>
          <div class="comparison-item">结果容易延迟遗漏</div>
        </article>
        <div class="comparison-bridge">→</div>
        <article class="comparison-panel is-after">
          <span class="panel-kicker">自动化之后</span>
          <h3>任务按计划运行</h3>
          <div class="comparison-item">自动进入指定后台</div>
          <div class="comparison-item">自动处理并同步</div>
          <div class="comparison-item">团队直接使用结果</div>
        </article>
      </section>
    </section>
    <footer class="page-meta"><span>对比同一任务，不堆功能</span><span class="page-no">02</span></footer>
  </main>
</body>
</html>
