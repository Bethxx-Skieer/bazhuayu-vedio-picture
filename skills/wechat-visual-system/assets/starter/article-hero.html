<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>正文横图｜可选 1920×1080</title>
<link rel="stylesheet" href="styles/common.css">
<link rel="stylesheet" href="styles/themes.css">
<style>
html, body, .canvas { width: 1920px; height: 1080px; }
h1 { position: absolute; top: 80px; left: 100px; right: 100px; margin: 0; text-align: center; font-size: 96px; line-height: 1.1; font-weight: 780; letter-spacing: -3px; }
.subtitle { position: absolute; top: 236px; left: 120px; right: 120px; margin: 0; text-align: center; color: var(--text-secondary); font-size: 52px; line-height: 1.3; font-weight: 430; }
.screenshot-frame { position: absolute; top: 360px; left: 80px; width: 1760px; height: 820px; border-radius: 16px 16px 0 0; }
</style>
</head>
<body>
<main class="canvas" data-theme="background-blue-aqua">
  <h1 class="gradient-text">让机器人忙碌起来</h1>
  <p class="subtitle">把任务分配给机器人们，<em class="emphasis">高效且清晰</em>执行你的工作流程。</p>
  <figure class="screenshot-frame">
    <img src="assets/product-shot.svg" alt="产品界面截图">
  </figure>
</main>
</body>
</html>
