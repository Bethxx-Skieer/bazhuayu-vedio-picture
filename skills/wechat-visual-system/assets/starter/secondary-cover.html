<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=766, initial-scale=1">
<title>微信次条封面</title>
<link rel="stylesheet" href="styles/common.css">
<link rel="stylesheet" href="styles/themes.css">
<script src="scripts/fit-text.js" defer></script>
<style>
html, body, .canvas { width: 766px; height: 766px; }
.copy {
  position: absolute;
  left: 134px;
  top: 115px;
  width: 498px;
  height: 536px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
h1 {
  width: 100%;
  max-width: 100%;
  max-height: 100%;
  margin: 0;
  font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
  font-size: 249px;
  line-height: 1.22;
  font-weight: 550;
  letter-spacing: 0;
  text-align: center;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="canvas" data-theme="dark-blue-purple">
  <section class="copy">
    <h1 class="gradient-text" data-fit-block data-min-size="115">客户<br>案例</h1>
  </section>
</main>
</body>
</html>
