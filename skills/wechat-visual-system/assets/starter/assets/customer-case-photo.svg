<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="766" viewBox="0 0 1160 766" role="img" aria-labelledby="title desc">
  <title id="title">客户现场照片占位图</title>
  <desc id="desc">用于客户案例人物封面母板的方向示意，实际生产时替换为用户提供的真实照片。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1731"/>
      <stop offset="0.55" stop-color="#17295c"/>
      <stop offset="1" stop-color="#3c245d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2454b2"/>
      <stop offset="1" stop-color="#7b4ac8"/>
