  </defs>
  <rect width="1160" height="766" fill="url(#bg)"/>
  <g fill="none" stroke="#8bb6ff" stroke-opacity=".45" stroke-width="3">
    <rect x="44" y="56" width="1072" height="112" rx="18"/>
    <rect x="350" y="202" width="360" height="232" rx="20"/>
    <rect x="736" y="202" width="380" height="232" rx="20"/>
    <rect x="350" y="460" width="766" height="250" rx="20"/>
  </g>
  <rect x="376" y="228" width="308" height="180" rx="16" fill="url(#panel)" opacity=".74"/>
  <rect x="762" y="228" width="328" height="180" rx="16" fill="#133a72" opacity=".78"/>
  <g fill="#55d4ff" opacity=".78">
    <rect x="790" y="256" width="260" height="12" rx="6"/>
