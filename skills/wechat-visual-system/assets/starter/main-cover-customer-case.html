<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1800, initial-scale=1">
<title>微信头条封面｜标杆客户案例人物版</title>
<link rel="stylesheet" href="styles/common.css">
<link rel="stylesheet" href="styles/themes.css">
<link rel="stylesheet" href="styles/main-cover-customer-case.css">
<script src="scripts/fit-text.js" defer></script>
</head>
<body>
<main class="canvas" data-theme="dark-spectrum">
  <figure class="case-photo">
    <img src="assets/customer-case-photo.svg" alt="客户现场照片占位图">
  </figure>
  <div class="case-photo-fade" aria-hidden="true"></div>

  <section class="case-copy" aria-label="客户案例封面标题">
    <p class="case-category">标杆客户案例</p>
    <h1>
      <span class="case-title-line" data-fit-text data-min-size="66">从「<em class="gradient-text">旧状态</em>」</span>
      <span class="case-title-line" data-fit-text data-min-size="66">到「<em class="gradient-text">新状态</em>」</span>
    </h1>
  </section>

  <div class="platform-title-scrim" aria-hidden="true"></div>
</main>
</body>
</html>
